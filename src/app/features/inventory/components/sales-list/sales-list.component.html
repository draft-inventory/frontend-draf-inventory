<div class="mat-elevation-z8 w-full h-screen bg-[#1B2431] px-5">
  <h2 class="font-bold text-white text-3xl pt-12 pb-7">Sales List</h2>
  <app-sales-toolbar (filterChange)="applyFilter($event)" [dataSource]="dataSource" >
  </app-sales-toolbar>

  <table mat-table [dataSource]="dataSource" class="sales-table">
    @for(column of columnas; track column.name) {
      <ng-container matColumnDef="{{column.name}}">
        <th mat-header-cell *matHeaderCellDef> {{column.titulo}} </th>
        <td mat-cell *matCellDef="let row">{{row[column.name]}} </td>
      </ng-container>
    }

    <!-- Fila de encabezados -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <!-- Fila de datos -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <!-- Columna de acción -->

  </table>


  <!-- TODO:  el paginator debe cambiar las paginas por fecha-->
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of sales date">
  </mat-paginator>
 </div>
